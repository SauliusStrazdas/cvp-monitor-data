name: Validate CVP contracts CSV

on:
  workflow_dispatch:
  push:
    paths:
      - "fixtures/contracts_sample.csv"
      - "scripts/validate_contract_csv.py"

permissions:
  contents: read

concurrency:
  group: validate-cvp-contracts
  cancel-in-progress: true

jobs:
  validate-contracts-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate CSV format and business gate
        run: python scripts/validate_contract_csv.py fixtures/contracts_sample.csv
