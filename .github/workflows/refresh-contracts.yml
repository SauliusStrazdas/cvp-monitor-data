name: Refresh CVP contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  refresh-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build daily contract snapshot
        env:
          CVP_API_KEY: ${{ secrets.CVP_API_KEY }}
        run: python scripts/build_contract_snapshot.py

      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sutartys_*.csv output/contract_snapshot_meta.json
          if git diff --cached --quiet; then
            echo "No contract snapshot changes."
          else
            git commit -m "Refresh daily CVP contract snapshot"
            git push
          fi
