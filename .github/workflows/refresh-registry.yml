name: Refresh CVP registry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh registry
        run: python scripts/build_registry.py

      - name: Commit refreshed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/registry_entities.csv
          git add output/registry_branches.csv
          git add output/source.sha256

          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Refresh registry output"
            git push
          fi
